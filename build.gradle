plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.14-R0.1-SNAPSHOT")
    implementation project(":ReloadHookProtocol")
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

apply from: 'easyreload.gradle'


evaluationDependsOn(':ReloadHookServer')
build.finalizedBy ":ReloadHookServer:build"

task run{
    finalizedBy ":ReloadHookServer:run"
}